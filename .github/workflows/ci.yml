name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # No install step: the library has no dependencies and the suite runs on
      # stdlib unittest, so this is the real "does it work from scratch".
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
